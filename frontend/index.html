    <!--
      웹폰트 (DESIGN.md Typography): Plus Jakarta Sans + Geist(Google Fonts), Cabinet Grotesk(Fontshare).
      두 CSS는 preload + onload 패턴으로 비동기 로드해 첫 페인트를 막지 않는다 (display=swap 유지).
      noscript 블록 안의 복사본은 JS가 꺼진 클라이언트용 폴백이다.
      scripts/prerender.mjs가 직렬화 전에 rel="preload"를 복원하고 이 패턴이 유지되는지 검증하므로,
      아래 태그를 바꾸면 prerender.mjs의 assertAsyncFontLinks도 함께 수정할 것.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist:wght@400;500;600&display=swap">
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap">

      <!-- Critical CSS for LCP optimization -->
    <style>
      /* 기본 다크 테마 색상 (초기 로딩용) */
      :root {
        --color-background: #1C1917;
        --color-surface: #262220;
        --color-text-primary: #F2EDE7;
        --color-text-secondary: #A69A8D;
        --color-border: #3A3430;
      }

      /*
       * 웹폰트 도착 전 텍스트에 쓰이는 로컬 폴백 폰트. size-adjust / ascent-override / descent-override /
       * line-gap-override로 웹폰트와 글자 폭·줄 높이를 맞춰 폰트 스왑 시 레이아웃 이동(CLS)이 생기지 않게 한다.
       * 값은 @capsizecss/unpack + createFontStack으로 계산 (size-adjust = 웹폰트 평균 글자폭 / 폴백 평균 글자폭,
       * *-override = 웹폰트 수직 메트릭 / size-adjust):
       *   Plus Jakarta Sans  ascent 1038 / descent 222 / lineGap 0 (UPM 1000), xWidthAvg 468(400) · 484(700)
       *   Cabinet Grotesk    ascent 870 / descent 280 / lineGap 90 (UPM 1000), xWidthAvg 435(500) · 441(700)
       *   Arial 1854 / 434 / 67 (UPM 2048), xWidthAvg 913 · 983(Bold)   Roboto 1900 / 500 / 0, 911 · 926(Bold)
       * Arial 계열은 macOS/iOS/Windows(+ Linux/ChromeOS의 Liberation Sans·Arimo), Roboto는 Android용.
       * 스택 순서는 src/style.css의 body / --font-display와 동일하게 유지할 것.
       */
      @font-face { font-family: 'Plus Jakarta Sans Fallback'; font-weight: 400; src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans'), local('Arimo'); size-adjust: 104.98%; ascent-override: 98.88%; descent-override: 21.15%; line-gap-override: 0%; }
      @font-face { font-family: 'Plus Jakarta Sans Fallback'; font-weight: 700; src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('LiberationSans-Bold'), local('Arimo Bold'); size-adjust: 100.84%; ascent-override: 102.94%; descent-override: 22.02%; line-gap-override: 0%; }
      @font-face { font-family: 'Plus Jakarta Sans Fallback Android'; font-weight: 400; src: local('Roboto'), local('Roboto Regular'), local('Roboto-Regular'); size-adjust: 105.21%; ascent-override: 98.66%; descent-override: 21.10%; line-gap-override: 0%; }
      @font-face { font-family: 'Plus Jakarta Sans Fallback Android'; font-weight: 700; src: local('Roboto Bold'), local('Roboto-Bold'); size-adjust: 107.04%; ascent-override: 96.97%; descent-override: 20.74%; line-gap-override: 0%; }
      @font-face { font-family: 'Cabinet Grotesk Fallback'; font-weight: 500; src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans'), local('Arimo'); size-adjust: 97.58%; ascent-override: 89.16%; descent-override: 28.70%; line-gap-override: 9.22%; }
      @font-face { font-family: 'Cabinet Grotesk Fallback'; font-weight: 700; src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('LiberationSans-Bold'), local('Arimo Bold'); size-adjust: 91.88%; ascent-override: 94.69%; descent-override: 30.48%; line-gap-override: 9.80%; }
      @font-face { font-family: 'Cabinet Grotesk Fallback Android'; font-weight: 500; src: local('Roboto'), local('Roboto Regular'), local('Roboto-Regular'); size-adjust: 97.79%; ascent-override: 88.96%; descent-override: 28.63%; line-gap-override: 9.20%; }
      @font-face { font-family: 'Cabinet Grotesk Fallback Android'; font-weight: 700; src: local('Roboto Bold'), local('Roboto-Bold'); size-adjust: 97.53%; ascent-override: 89.20%; descent-override: 28.71%; line-gap-override: 9.23%; }

      body {
        /* 폰 프레임 바깥 레터박스도 프레임 내부와 동일한 테마 배경을 사용한다 (frontend/src/style.css와 동일) */
        background-color: var(--color-background);
        color: var(--color-text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Plus Jakarta Sans', 'Plus Jakarta Sans Fallback', 'Plus Jakarta Sans Fallback Android', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Skeleton loader - exact layout match with RoomScreen */
      .app-skeleton {
        max-width: 1600px;
        margin: 0 auto;
        padding: 1.5rem; /* p-6 */
      }

      .app-skeleton__main {
        background-color: var(--color-surface);
        border-radius: 0.75rem; /* rounded-xl */
        padding: 2rem; /* p-8 */
        border: 1px solid var(--color-border);
        transition: background-color 0.3s ease, border-color 0.3s ease;
      }

      .app-skeleton__grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.5rem; /* gap-6 */
        margin-top: 2rem;
      }

      .app-skeleton__card {
        position: relative;
        border-radius: 0.5rem; /* rounded-lg */
        overflow: hidden;
        border: 2px dashed var(--color-border);
        background-color: var(--color-background);
        transition: all 0.3s ease;
      }

      .app-skeleton__card-content {
        width: 100%;
        height: 200px; /* h-[200px] */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem; /* gap-3 */
        background-color: var(--color-surface);
        opacity: 0.5;
      }

      .app-skeleton__icon {
        font-size: 80px; /* text-[80px] - CRITICAL FOR LCP */
        line-height: 1;
      }

      .app-skeleton__title {
        font-size: 0.875rem; /* text-sm */
        font-weight: 600; /* font-semibold */
        color: var(--color-text-primary);
      }

      .app-skeleton__subtitle {
        font-size: 0.75rem; /* text-xs */
        color: var(--color-text-secondary);
        padding: 0 1rem; /* px-4 */
        text-align: center;
      }

      /* Hide skeleton when Vue app mounts */
      #app:not(:empty) > .app-skeleton {
        display: none;
      }
    </style>
