<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>페이지를 찾을 수 없어요 - Clipboard Share</title>
  <meta name="description" content="주소가 잘못되었거나 사라진 페이지입니다. 홈으로 돌아가면 바로 파일과 텍스트를 주고받을 수 있습니다." />
  <meta name="robots" content="noindex" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="페이지를 찾을 수 없어요 - Clipboard Share" />
  <meta property="og:description" content="주소가 잘못되었거나 사라진 페이지입니다. 홈으로 돌아가면 바로 파일과 텍스트를 주고받을 수 있습니다." />
  <meta property="og:image" content="https://www.clipboardapp.org/og-image.png" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="Clipboard Share" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">

  <style>
    :root {
      --bg: #FAF8F5;
      --surface: #FFFFFF;
      --border: #E9E3DA;
      --text: #2A2622;
      --muted: #8A8178;
      --accent: #FF6B4A;
      --accent-text: #C8432A;
      --cta-text: #2A2622;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1917;
        --surface: #262220;
        --border: #3A3430;
        --text: #F2EDE7;
        --muted: #A69A8D;
        --accent: #FF7A5C;
        --accent-text: #FF7A5C;
        --cta-text: #1C1917;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .wrap { max-width: 40rem; margin: 0 auto; padding: 8px 16px 64px; }

    header.site { display: flex; align-items: center; gap: 16px; padding: 16px 0 32px; }
    .brand { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); text-decoration: none; }
    .brand em { font-style: normal; color: var(--accent-text); }

    h1 { font-size: 28px; font-weight: 700; line-height: 1.35; letter-spacing: -0.02em; margin: 0 0 16px; }
    h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 40px 0 12px; }
    h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
    p { margin: 0 0 16px; }
    .lead { color: var(--text); }

    a { color: var(--accent-text); text-decoration: none; }
    a:hover { text-decoration: underline; }

    ol, ul { margin: 0 0 16px; padding-left: 24px; }
    li { margin: 0 0 8px; }
    li:last-child { margin-bottom: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin: 16px 0;
    }
    .card > :last-child { margin-bottom: 0; }
    .card h3:first-child { margin-top: 0; }

    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px 6px;
    }

    .cta {
      display: inline-block;
      background: var(--accent);
      color: var(--cta-text);
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 600;
      text-decoration: none;
      margin: 8px 0 0;
    }
    .cta:hover { opacity: 0.88; text-decoration: none; }
    .cta-secondary { background: transparent; color: var(--accent-text); border: 1px solid var(--accent-text); margin-left: 8px; }

    .related ul { list-style: none; padding: 0; }

    footer.site {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
    }
    footer.site nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 12px; }
    footer.site p { margin: 0; }

    @media (max-width: 480px) {
      h1 { font-size: 24px; }
      h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="brand" href="/">Clipboard <em>Share</em></a>
    </header>

    <main>
      <article>
        <h1>페이지를 찾을 수 없어요</h1>
        <p class="lead">주소가 잘못되었거나 사라진 페이지입니다.</p>
        <p class="lead">This page doesn't exist. The clipboard is one tap away.</p>

        <p>
          <a class="cta" href="/">홈으로 가기</a>
          <a class="cta cta-secondary" href="/en/">Open in English</a>
        </p>
      </article>
    </main>

    <footer class="site">
      <nav>
      <a href="/">홈</a>
      <a href="/how-to-use.html">사용법</a>
      <a href="/faq.html">자주 묻는 질문</a>
      <a href="https://github.com/Kangchanghwan/only_ai_project" rel="noopener">GitHub</a>
      </nav>
      <p>설치도 가입도 없이, 브라우저만 열면 되는 클립보드.</p>
    </footer>
  </div>
</body>
</html>
