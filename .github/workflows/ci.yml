# PR과 master 푸시에서 도는 기본 CI. 고위험 변경(PR)은 이 결과 + owner 승인으로 머지한다.
name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ops/scripts/check-seo.mjs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npm run build:prod

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26  # --localstorage-file 플래그 때문에 최신 Node 필요
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --ci
